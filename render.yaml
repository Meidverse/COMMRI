# Render Blueprint — NeuroScan AI (web app + managed PostgreSQL)
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# Region/database name are permanent once created.
databases:
  - name: neuroscan-db
    databaseName: neuroscan
    user: neuroscan
    plan: free            # free Postgres expires after 30 days; use basic-256mb to keep it
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: neuroscan-ai
    runtime: python
    region: singapore
    plan: starter         # 512 MB RAM; use "standard" (2 GB) if the service runs out of memory
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir app app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: neuroscan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false        # entered in the Dashboard when the Blueprint is created
      - key: ADMIN_PASSWORD
        sync: false
      - key: OMP_NUM_THREADS
        value: "2"
