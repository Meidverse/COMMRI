# Render Blueprint — NeuroScan AI (web app + managed PostgreSQL)
# DATABASE_URL (Neon) is set in the dashboard; MIGRATE_FROM_URL is linked by Render — no password is stored in the repo.
databases:
  - name: neuroscan-db
    plan: free            # free Postgres expires after 30 days; upgrade to basic-256mb to keep it
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: neuroscan-ai
    runtime: python
    region: singapore
    plan: free            # upgrade to starter/standard for no sleep and more memory
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir app app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Main database: Neon free Postgres (does not expire). Set the value in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # One-time copy from the old Render free database (expires 2026-12-24). The app copies only into an
      # empty database, so this is harmless after the move; remove it and the old database afterwards.
      - key: MIGRATE_FROM_URL
        fromDatabase:
          name: neuroscan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_DEMO        # fill an empty database with demo patients/analyses (only when empty)
        value: "1"
      - key: XRAY_MODEL       # v2 = Kaggle + FracAtlas model with body-part check
        value: v2
      - key: OMP_NUM_THREADS
        value: "2"
