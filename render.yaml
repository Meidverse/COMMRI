# Render Blueprint — NeuroScan AI (web app + managed PostgreSQL)
# Render links DATABASE_URL to the database automatically (fromDatabase) — no password is stored in the repo.
databases:
  - name: neuroscan-db
    plan: free            # free Postgres expires after 30 days; upgrade to basic-256mb to keep it
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: neuroscan-ai
    runtime: python
    region: singapore
    plan: free            # upgrade to starter/standard for no sleep and more memory
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir app app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: neuroscan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_DEMO        # fill an empty database with demo patients/analyses (only when empty)
        value: "1"
      - key: OMP_NUM_THREADS
        value: "2"
